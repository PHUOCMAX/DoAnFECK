name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install mobile dependencies
        run: npm --prefix frontend/mobile ci

      - name: Install web dependencies
        run: npm --prefix frontend/web ci

      - name: Backend tests
        run: npm --prefix backend run test

      - name: Mobile typecheck
        run: npm --prefix frontend/mobile run typecheck

      - name: Web lint
        run: npm --prefix frontend/web run lint

      - name: Web build
    env:
    VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
  run: npm --prefix frontend/web run build