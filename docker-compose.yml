services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: multilingual-tour-guide-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: multilingual_tour_guide
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      VNP_ENABLED: ${VNP_ENABLED:-false}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-}
      VNP_IPN_URL: ${VNP_IPN_URL:-}
      VNP_FRONTEND_RETURN_URL: ${VNP_FRONTEND_RETURN_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TOUR_ACCESS_HOURS: ${TOUR_ACCESS_HOURS:-2}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LIBRETRANSLATE_URL: http://libretranslate:5000
    ports:
      - "5001:5001"
    depends_on:
      - mysql
      - qdrant
      - libretranslate

  frontend:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY}
    container_name: multilingual-tour-guide-frontend
    ports:
      - "8080:80"
    restart: unless-stopped


  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    ports:
      - "5002:5000"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: multilingual-tour-guide-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multilingual_tour_guide

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  qdrant:
    image: qdrant/qdrant:latest
    container_name: multilingual-tour-guide-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data: